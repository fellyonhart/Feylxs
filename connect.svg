<svg width="900" height="170" viewBox="0 0 900 170" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050B1F"/>
      <stop offset="50%" stop-color="#0F2A4A"/>
      <stop offset="100%" stop-color="#050B1F"/>
    </linearGradient>

    <!-- Outer Frame Glow -->
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Badge Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="4" y="4" width="892" height="162" rx="14" fill="url(#bg2)" stroke="#4CC9F0" stroke-width="2" filter="url(#glow2)"/>

  <!-- Corner Accents -->
  <g stroke="#4CC9F0" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M 20 34 L 20 18 L 36 18"/>
    <path d="M 864 18 L 880 18 L 880 34"/>
    <path d="M 20 136 L 20 152 L 36 152"/>
    <path d="M 864 152 L 880 152 L 880 136"/>
  </g>

  <!-- Title -->
  <text x="450" y="48" text-anchor="middle" font-family="'Courier New', monospace" font-weight="800" font-size="22" fill="#ffffff" filter="url(#glow2)" letter-spacing="4">CONNECT WITH ME</text>
  <line x1="385" y1="58" x2="515" y2="58" stroke="#4CC9F0" stroke-width="1.2" opacity="0.6"/>

  <!-- Social Badges Group -->
  <g font-family="'Courier New', monospace" font-weight="700" font-size="15" letter-spacing="1.5">
    <!-- Instagram Badge -->
    <g transform="translate(265, 88)">
      <rect x="0" y="0" width="170" height="44" rx="22" fill="#0A1930" stroke="#4CC9F0" stroke-width="2" filter="url(#glow)"/>
      <text x="85" y="23" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">INSTAGRAM</text>
    </g>

    <!-- LinkedIn Badge -->
    <g transform="translate(465, 88)">
      <rect x="0" y="0" width="170" height="44" rx="22" fill="#0A1930" stroke="#4CC9F0" stroke-width="2" filter="url(#glow)"/>
      <text x="85" y="23" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">LINKEDIN</text>
    </g>
  </g>
</svg>
